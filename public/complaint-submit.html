<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>แจ้งร้องเรียน</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f8fafc;color:#1e293b;min-height:100vh}

.header{background:#dc2626;color:#fff;padding:1.5rem 1.5rem 1.25rem}
.header-inner{max-width:560px;margin:0 auto}
.header h1{font-size:1.3rem;font-weight:700;display:flex;align-items:center;gap:.5rem}
.header p{font-size:.83rem;opacity:.85;margin-top:.35rem;line-height:1.5}

.container{max-width:560px;margin:0 auto;padding:1.25rem 1rem 3rem}

.card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);margin-bottom:1rem;overflow:hidden}
.card-head{background:#fef2f2;padding:.65rem 1.1rem;font-size:.82rem;font-weight:700;color:#991b1b;border-bottom:1px solid #fecaca;display:flex;align-items:center;gap:.4rem}
.card-body{padding:1.1rem}

.form-group{margin-bottom:.9rem}
.form-group:last-child{margin-bottom:0}
label{display:block;font-size:.8rem;font-weight:600;color:#475569;margin-bottom:.28rem}
.req{color:#ef4444}
input[type=text],input[type=email],input[type=tel],select,textarea{
  width:100%;border:1px solid #cbd5e1;border-radius:7px;padding:.52rem .75rem;
  font-size:.88rem;font-family:inherit;color:#1e293b;background:#fff;outline:none;
  transition:border .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:#ef4444;box-shadow:0 0 0 3px rgba(239,68,68,.12)}
textarea{resize:vertical;min-height:130px;line-height:1.55}

.btn-submit{width:100%;background:#dc2626;color:#fff;border:none;border-radius:8px;padding:.85rem;font-size:1rem;font-weight:700;cursor:pointer;transition:background .15s;margin-top:.5rem}
.btn-submit:hover{background:#b91c1c}
.btn-submit:disabled{background:#fca5a5;cursor:not-allowed}

.submit-err{background:#fef2f2;border:1px solid #fecaca;border-radius:8px;padding:.7rem 1rem;font-size:.82rem;color:#dc2626;margin-bottom:.75rem;display:none}

.success-card{background:#fff;border-radius:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);padding:2.5rem 1.5rem;text-align:center}
.success-icon{font-size:3.5rem;margin-bottom:.75rem}
.success-card h2{color:#166534;font-size:1.2rem;font-weight:700;margin-bottom:.4rem}
.success-card p{color:#475569;font-size:.85rem;line-height:1.6;margin-bottom:1.25rem}
.btn-again{display:inline-block;color:#dc2626;font-size:.85rem;cursor:pointer;background:none;border:1px solid #fecaca;border-radius:7px;padding:.45rem 1.25rem;font-family:inherit}
.btn-again:hover{background:#fef2f2}

.required-note{font-size:.75rem;color:#94a3b8;margin-bottom:.75rem}
.char-count{font-size:.72rem;color:#94a3b8;text-align:right;margin-top:.2rem}
.char-count.near{color:#f59e0b}
.char-count.over{color:#dc2626}
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <h1>📣 แจ้งร้องเรียน</h1>
    <p>กรุณากรอกข้อมูลด้านล่างเพื่อส่งเรื่องร้องเรียนถึงทีมงาน</p>
  </div>
</div>

<div class="container">

  <div id="form-box">
    <p class="required-note">ช่องที่มี <span style="color:#ef4444">*</span> จำเป็นต้องกรอก</p>

    <!-- ข้อมูลผู้แจ้ง -->
    <div class="card">
      <div class="card-head">🏢 ข้อมูลผู้แจ้ง</div>
      <div class="card-body">
        <div class="form-group">
          <label>ชื่อร้าน / บริษัท <span class="req">*</span></label>
          <input type="text" id="inp-company" placeholder="ชื่อร้านค้าหรือบริษัทของท่าน"/>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:.65rem">
          <div class="form-group">
            <label>ชื่อผู้แจ้ง</label>
            <input type="text" id="inp-name" placeholder="ชื่อ-นามสกุล"/>
          </div>
          <div class="form-group">
            <label>เบอร์โทร</label>
            <input type="tel" id="inp-phone" placeholder="08X-XXXXXXX"/>
          </div>
        </div>
        <div class="form-group">
          <label>อีเมล <span style="color:#94a3b8;font-weight:400">(ไม่บังคับ)</span></label>
          <input type="email" id="inp-email" placeholder="example@email.com"/>
        </div>
      </div>
    </div>

    <!-- รายละเอียดร้องเรียน -->
    <div class="card">
      <div class="card-head">📝 รายละเอียดการร้องเรียน</div>
      <div class="card-body">
        <div class="form-group">
          <label>ประเภทการร้องเรียน</label>
          <select id="inp-type">
            <option value="">— เลือกประเภท (ไม่บังคับ) —</option>
            <option value="service">การให้บริการ</option>
            <option value="product">ผลิตภัณฑ์ / อุปกรณ์</option>
            <option value="software">ซอฟต์แวร์ / ระบบ</option>
            <option value="staff">พฤติกรรมเจ้าหน้าที่</option>
            <option value="delay">ความล่าช้า</option>
            <option value="other">อื่นๆ</option>
          </select>
        </div>
        <div class="form-group">
          <label>ข้อความร้องเรียน <span class="req">*</span></label>
          <textarea id="inp-message" placeholder="โปรดอธิบายปัญหาหรือข้อร้องเรียนของท่านอย่างละเอียด..." oninput="updateCharCount()" maxlength="2000"></textarea>
          <div class="char-count" id="char-count">0 / 2000</div>
        </div>
      </div>
    </div>

    <div class="submit-err" id="submit-err"></div>
    <button class="btn-submit" id="btn-submit" onclick="submitComplaint()">📤 ส่งการร้องเรียน</button>
  </div>

  <!-- Success -->
  <div id="success-box" style="display:none">
    <div class="success-card">
      <div class="success-icon">✅</div>
      <h2>ส่งร้องเรียนเรียบร้อยแล้ว</h2>
      <p>ทีมงานได้รับข้อมูลของท่านแล้ว<br>จะดำเนินการตรวจสอบและติดต่อกลับโดยเร็วที่สุด</p>
      <button class="btn-again" onclick="resetForm()">📝 แจ้งร้องเรียนอีกครั้ง</button>
    </div>
  </div>

</div>

<script>
function updateCharCount() {
  const len = document.getElementById('inp-message').value.length;
  const el  = document.getElementById('char-count');
  el.textContent = `${len} / 2000`;
  el.className = 'char-count' + (len > 1800 ? ' over' : len > 1500 ? ' near' : '');
}

async function submitComplaint() {
  const company = document.getElementById('inp-company').value.trim();
  const msg     = document.getElementById('inp-message').value.trim();
  const name    = document.getElementById('inp-name').value.trim();
  const phone   = document.getElementById('inp-phone').value.trim();
  const email   = document.getElementById('inp-email').value.trim();
  const type    = document.getElementById('inp-type').value;

  if (!company) { showErr('กรุณาระบุชื่อร้าน / บริษัท'); return; }
  if (!msg)     { showErr('กรุณาระบุข้อความร้องเรียน'); return; }

  const btn = document.getElementById('btn-submit');
  btn.disabled = true; btn.textContent = '⏳ กำลังส่ง...';

  try {
    const fullMsg = (type ? `[${typeLabel(type)}] ` : '') + msg;

    const r = await fetch('/api/public/complaint/direct', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        company_name:  company,
        contact_name:  name  || null,
        contact_phone: phone || null,
        email:         email || null,
        message:       fullMsg
      })
    });
    const d = await r.json();
    if (!r.ok) { showErr(d.error || 'ส่งไม่สำเร็จ กรุณาลองใหม่'); return; }

    document.getElementById('form-box').style.display = 'none';
    document.getElementById('success-box').style.display = '';
    window.scrollTo({ top:0, behavior:'smooth' });
  } catch { showErr('เกิดข้อผิดพลาด กรุณาลองใหม่'); }
  finally { btn.disabled = false; btn.textContent = '📤 ส่งการร้องเรียน'; }
}

function showErr(msg) {
  const el = document.getElementById('submit-err');
  el.textContent = '❌ ' + msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior:'smooth', block:'center' });
}

function typeLabel(v) {
  return { service:'การให้บริการ', product:'ผลิตภัณฑ์/อุปกรณ์', software:'ซอฟต์แวร์/ระบบ', staff:'พฤติกรรมเจ้าหน้าที่', delay:'ความล่าช้า', other:'อื่นๆ' }[v] || v;
}

function resetForm() {
  ['inp-company','inp-name','inp-phone','inp-email','inp-message'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('inp-type').value = '';
  updateCharCount();
  document.getElementById('submit-err').style.display = 'none';
  document.getElementById('form-box').style.display = '';
  document.getElementById('success-box').style.display = 'none';
}
</script>
</body>
</html>
