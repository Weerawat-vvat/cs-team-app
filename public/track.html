<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ติดตามเคส — CS Team</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',Tahoma,sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh}
.top-bar{background:#1e293b;color:#fff;padding:.75rem 1.25rem;display:flex;align-items:center;justify-content:space-between;gap:.75rem;flex-wrap:wrap}
.logo{font-size:.95rem;font-weight:800;color:#fff}
.sub{font-size:.72rem;color:#94a3b8;margin-top:.1rem}
.container{max-width:1100px;margin:0 auto;padding:1.25rem 1rem}

/* Date filter */
.date-bar{background:#fff;border:1px solid #e2e8f0;border-radius:10px;padding:.55rem 1rem;display:flex;align-items:center;gap:.4rem;flex-wrap:wrap;margin-bottom:1rem;box-shadow:0 1px 3px #0001}
.drb-btn{border:1px solid #e2e8f0;background:#fff;color:#475569;padding:.28rem .7rem;border-radius:20px;font-size:.77rem;cursor:pointer;font-family:inherit;transition:.12s}
.drb-btn:hover,.drb-btn.active{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}
.date-input{border:1px solid #e2e8f0;border-radius:7px;padding:.28rem .55rem;font-size:.78rem;color:#1e293b;outline:none}
.date-input:focus{border-color:#2563eb}
.date-range-label{font-size:.75rem;color:#64748b;margin-left:auto;white-space:nowrap}

/* Stat cards */
.stat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.45rem;margin-bottom:.75rem}
@media(max-width:700px){.stat-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:480px){.stat-grid{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.req-stat-grid{grid-template-columns:1fr 1fr!important}}
.stat-card{background:#fff;border-radius:9px;padding:.45rem .75rem;border:1px solid #e2e8f0;box-shadow:0 1px 3px #0001;display:flex;align-items:center;gap:.5rem}
.stat-card .icon{width:28px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:.85rem;flex-shrink:0}
.stat-card .label{font-size:.67rem;color:#64748b;font-weight:500}
.stat-card .value{font-size:1.2rem;font-weight:800;line-height:1.1;margin:.04rem 0}
.stat-card .sub{font-size:.65rem;color:#94a3b8}

/* Page tabs */
.nav-tabs{display:flex;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:.3rem;gap:.2rem;box-shadow:0 1px 4px #0001;margin-bottom:1rem;flex-wrap:wrap}
.nav-tab{border:none;background:none;padding:.5rem 1rem;border-radius:8px;font-size:.82rem;cursor:pointer;color:#64748b;font-weight:500;font-family:inherit;transition:all .15s;display:flex;align-items:center;gap:.4rem;white-space:nowrap}
.nav-tab:hover{background:#f1f5f9;color:#1e293b}
.nav-tab.active{background:#2563eb;color:#fff;font-weight:700;box-shadow:0 2px 8px #2563eb33}
.nav-tab svg{width:15px;height:15px;flex-shrink:0;opacity:.8}
.nav-tab.active svg{opacity:1}
.nav-tab .tab-badge{background:rgba(255,255,255,.25);color:inherit;border-radius:20px;font-size:.68rem;padding:.05rem .35rem;font-weight:700;min-width:18px;text-align:center}
.nav-tab:not(.active) .tab-badge{background:#e2e8f0;color:#475569}

/* Charts */
.chart-grid{display:grid;grid-template-columns:1.4fr 1fr;gap:.75rem;margin-bottom:.75rem}
.chart-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:.75rem;margin-bottom:.75rem}
@media(max-width:800px){.chart-grid,.chart-grid-3{grid-template-columns:1fr}}
.card{background:#fff;border-radius:12px;padding:.9rem 1.1rem;border:1px solid #e2e8f0;box-shadow:0 1px 4px #0001}
.card-title{font-size:.82rem;font-weight:700;color:#475569;margin-bottom:.65rem;display:flex;align-items:center;gap:.35rem}
.chart-wrap{position:relative;height:200px}
.chart-wrap-sm{position:relative;height:160px}

/* TOP5 */
.top5-item{display:flex;align-items:center;gap:.6rem;padding:.45rem 0;border-bottom:1px solid #f1f5f9}
.top5-item:last-child{border:none}
.top5-rank{width:22px;height:22px;border-radius:50%;background:#f1f5f9;color:#64748b;font-size:.72rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.top5-rank.r1{background:#fef3c7;color:#92400e}
.top5-rank.r2{background:#f1f5f9;color:#475569}
.top5-rank.r3{background:#fef2f2;color:#b91c1c}
.top5-bar-wrap{flex:1;min-width:0}
.top5-name{font-size:.8rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top5-sub{font-size:.7rem;color:#64748b}
.top5-bar-track{height:5px;background:#f1f5f9;border-radius:3px;margin-top:.25rem}
.top5-bar-fill{height:5px;border-radius:3px;background:#2563eb}
.top5-cnt{font-size:.88rem;font-weight:800;color:#2563eb;flex-shrink:0}

/* Filter bar (list tab) */
.filter-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.75rem;align-items:center}
.filter-select{border:1px solid #e2e8f0;border-radius:8px;padding:.32rem .7rem;font-size:.8rem;background:#fff;color:#1e293b;outline:none}
.filter-input{border:1px solid #e2e8f0;border-radius:8px;padding:.32rem .7rem;font-size:.8rem;flex:1;min-width:150px;outline:none}
.filter-input:focus,.filter-select:focus{border-color:#2563eb}

/* Status tabs */
.status-tabs{display:flex;gap:.2rem;margin-bottom:.75rem;flex-wrap:wrap}
.s-tab{border:none;background:#f1f5f9;color:#475569;padding:.32rem .85rem;border-radius:20px;font-size:.78rem;cursor:pointer;font-weight:500;font-family:inherit;transition:.12s;display:flex;align-items:center;gap:.3rem}
.s-tab.active{font-weight:700}
.s-tab.t-open.active{background:#fee2e2;color:#b91c1c}
.s-tab.t-close.active{background:#dcfce7;color:#15803d}
.s-tab.t-all.active{background:#dbeafe;color:#1d4ed8}
.s-tab-cnt{background:rgba(0,0,0,.08);border-radius:10px;padding:.05rem .35rem;font-size:.7rem;font-weight:700}

/* Table */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.8rem}
th{background:#f8fafc;padding:.45rem .65rem;text-align:left;font-size:.72rem;font-weight:700;color:#64748b;white-space:nowrap;border-bottom:2px solid #e2e8f0}
td{padding:.42rem .65rem;border-bottom:1px solid #f1f5f9;vertical-align:middle}
tr:hover td{background:#f8fafc}
.badge{display:inline-block;padding:.15rem .55rem;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap}
.b-close{background:#dcfce7;color:#15803d}
.b-open{background:#fee2e2;color:#b91c1c}
.b-other{background:#f1f5f9;color:#475569}

/* Pagination */
.pagi{display:flex;align-items:center;justify-content:center;gap:.3rem;margin-top:.75rem;flex-wrap:wrap}
.pagi button{min-width:30px;height:30px;border:1px solid #e2e8f0;background:#fff;border-radius:6px;font-size:.78rem;cursor:pointer;font-family:inherit}
.pagi button.active{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:700}
.pagi button:disabled{opacity:.4;cursor:not-allowed}

/* Misc */
.empty{text-align:center;padding:2.5rem;color:#94a3b8;font-size:.85rem}
.loading{text-align:center;padding:4rem;color:#64748b}
.error-box{background:#fef2f2;border:1px solid #fecaca;border-radius:10px;padding:1.5rem;text-align:center;color:#b91c1c;margin-top:1rem}
.btn{border:none;border-radius:8px;padding:.42rem .95rem;font-size:.8rem;font-weight:600;cursor:pointer;font-family:inherit}
.btn-red{background:#ef4444;color:#fff}
.btn-red:hover{background:#dc2626}

/* Message */
.msg-card{background:#fff;border-radius:12px;padding:1rem 1.2rem;border:1px solid #e2e8f0;margin-top:.75rem;box-shadow:0 1px 4px #0001}
.msg-input{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:.4rem .65rem;font-size:.82rem;font-family:inherit;resize:vertical;min-height:70px;outline:none;margin:.35rem 0}
.msg-input:focus{border-color:#2563eb}
.msg-name{width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:.35rem .65rem;font-size:.8rem;font-family:inherit;outline:none;margin-bottom:.35rem}
.send-btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:.42rem 1rem;font-size:.8rem;font-weight:600;cursor:pointer;width:100%}
.bubble-wrap{max-height:220px;overflow-y:auto;margin-bottom:.5rem}
.bubble{border-radius:10px;padding:.4rem .7rem;margin-bottom:.4rem;font-size:.82rem;line-height:1.55;max-width:85%}
.bubble.cust{background:#f1f5f9;margin-right:auto}
.bubble.admin{background:#dbeafe;margin-left:auto;text-align:right}
.bubble .bfrom{font-size:.68rem;font-weight:700;color:#64748b;margin-bottom:.1rem}
.bubble.admin .bfrom{color:#1d4ed8}
.bubble .btime{font-size:.65rem;color:#94a3b8;margin-top:.15rem}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes slideIn{from{transform:translateX(110%);opacity:0}to{transform:translateX(0);opacity:1}}
#repair-update-badge{display:none!important}
#repair-update-badge.show{display:inline-flex!important}
#track-toast-wrap{position:fixed;top:1rem;right:1rem;z-index:9999;display:flex;flex-direction:column;gap:.5rem;pointer-events:none}
.track-toast{background:#1e293b;color:#fff;padding:.65rem 1rem;border-radius:10px;font-size:.82rem;font-weight:500;box-shadow:0 4px 16px #0003;animation:slideIn .3s ease;pointer-events:auto;display:flex;align-items:flex-start;gap:.5rem;max-width:300px}
.track-toast.red{background:#dc2626}
.track-toast.green{background:#16a34a}
</style>
</head>
<body>
<div id="track-toast-wrap"></div>
<div class="top-bar">
  <div>
    <div class="logo" id="page-title">📋 CS Team — ติดตามเคส</div>
    <div class="sub" id="page-sub">Customer Ticket Tracking</div>
  </div>
  <button class="btn btn-red" onclick="openComplain(null)" style="font-size:.78rem;padding:.32rem .8rem">📣 แจ้งปัญหา</button>
</div>

<div class="container" id="root">
  <div class="loading">⏳ กำลังโหลด...</div>
</div>

<!-- Complain Modal -->
<div id="modal-complain" style="display:none;position:fixed;inset:0;background:#0007;z-index:1000;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:14px;padding:1.4rem;width:min(440px,95vw)">
    <div style="font-size:.95rem;font-weight:800;margin-bottom:.9rem">📣 แจ้งปัญหา / ร้องเรียน</div>
    <input type="hidden" id="c-ticket-id"/>
    <div style="margin-bottom:.5rem"><label style="font-size:.75rem;font-weight:600;color:#475569;display:block;margin-bottom:.2rem">Email (ไม่บังคับ)</label>
      <input type="email" id="c-email" placeholder="your@email.com" style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:.38rem .65rem;font-size:.82rem;outline:none"/></div>
    <div style="margin-bottom:.75rem"><label style="font-size:.75rem;font-weight:600;color:#475569;display:block;margin-bottom:.2rem">รายละเอียด *</label>
      <textarea id="c-msg" rows="3" placeholder="อธิบายปัญหา..." style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:.38rem .65rem;font-size:.82rem;font-family:inherit;resize:vertical;outline:none"></textarea></div>
    <div style="display:flex;gap:.5rem;justify-content:flex-end">
      <button onclick="closeComplain()" style="border:1px solid #e2e8f0;background:#fff;border-radius:8px;padding:.38rem .85rem;font-size:.8rem;cursor:pointer">ยกเลิก</button>
      <button class="btn btn-red" id="complain-submit-btn" onclick="submitComplain()">📤 ส่ง</button>
    </div>
  </div>
</div>

<script>
const token = new URLSearchParams(location.search).get('t');
let _data = null, _statusTab = 'open', _branchFilter = '', _page = 1, _perPage = 25, _search = '';
let _charts = {};
let _dateFrom = '', _dateTo = '';
let _requirements = null;
let _issues = null;

// ── Requirements helpers ──────────────────────────────────
const REQ_STATUS_STYLE = {
  'รับเรื่อง':       'background:#dbeafe;color:#1d4ed8',
  'วิเคราะห์':        'background:#ede9fe;color:#5b21b6',
  'กำลังดำเนินการ':   'background:#fef9c3;color:#854d0e',
  'ทดสอบ':           'background:#ffedd5;color:#c2410c',
  'รอส่งมอบ':        'background:#e0f2fe;color:#0369a1',
  'เสร็จสิ้น':        'background:#dcfce7;color:#15803d',
  'ยกเลิก':           'background:#f1f5f9;color:#64748b',
};
const REQ_PRIORITY_STYLE = {
  critical:'background:#fee2e2;color:#b91c1c',
  high:    'background:#ffedd5;color:#c2410c',
  medium:  'background:#fef9c3;color:#854d0e',
  low:     'background:#dcfce7;color:#15803d',
};
const REQ_PRIORITY_LABEL = { critical:'🔴 Critical', high:'🟠 High', medium:'🟡 Medium', low:'🟢 Low' };

const REQ_STATUS_PROGRESS = {
  'งานใหม่':            5,
  'กำลังประเมินราคา':   15,
  'กำลังดำเนินการ':     50,
  'UAT':                75,
  'รอส่งมอบ':           90,
  'ส่งมอบแล้ว':         100,
  'ยกเลิก':             0,
};
function reqAutoProgress(status){ return REQ_STATUS_PROGRESS[status] ?? 0; }

function reqStatusBadge(s){
  const style = REQ_STATUS_STYLE[s]||'background:#f1f5f9;color:#475569';
  return `<span style="${style};padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap">${esc(s||'—')}</span>`;
}
function reqPriBadge(p){
  const style = REQ_PRIORITY_STYLE[p]||REQ_PRIORITY_STYLE.medium;
  return `<span style="${style};padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap">${REQ_PRIORITY_LABEL[p]||p}</span>`;
}
function reqProgressBar(pct){
  const p = Math.max(0,Math.min(100,pct||0));
  const col = p>=100?'#16a34a':p>=60?'#2563eb':p>=30?'#d97706':'#94a3b8';
  return `<div style="display:flex;align-items:center;gap:.5rem;margin:.3rem 0">
    <div style="flex:1;height:7px;background:#e2e8f0;border-radius:4px;overflow:hidden">
      <div style="width:${p}%;height:100%;background:${col};border-radius:4px;transition:width .4s"></div>
    </div>
    <span style="font-size:.75rem;font-weight:700;color:${col};min-width:32px">${p}%</span>
  </div>`;
}

// ── Helpers ──────────────────────────────────────────────
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function parseD(s){ return s ? new Date(String(s).replace('Z','')) : null; }
function fmtDate(s){
  const d=parseD(s); if(!d) return '—';
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})
    +' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}
function fmtD(s){
  const d=parseD(s); if(!d) return '—';
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'});
}
function fmtDur(m){ if(m==null||m<0) return '—'; return m>=60?`${Math.floor(m/60)}ชม.${m%60}น.`:`${m}น.`; }
function isClosed(s){ return (s||'').toLowerCase().includes('close')||(s||'').toLowerCase().includes('complete'); }
function badgeCls(s){ return isClosed(s)?'b-close':(s||'').toLowerCase().includes('open')?'b-open':'b-other'; }
function today(){ return new Date().toISOString().split('T')[0]; }
function daysAgo(n){ const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; }

// ── Date filter ──────────────────────────────────────────
function setRange(preset, btn){
  document.querySelectorAll('.drb-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const t = today();
  if(preset==='today')    { _dateFrom=t; _dateTo=t; }
  else if(preset==='7d')  { _dateFrom=daysAgo(6); _dateTo=t; }
  else if(preset==='30d') { _dateFrom=daysAgo(29); _dateTo=t; }
  else if(preset==='month'){ const d=new Date(); _dateFrom=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`; _dateTo=t; }
  if(preset!=='custom'){
    document.getElementById('df').value=_dateFrom;
    document.getElementById('dt').value=_dateTo;
    loadData();
  }
}
function applyCustom(){
  _dateFrom=document.getElementById('df').value;
  _dateTo=document.getElementById('dt').value;
  if(_dateFrom&&_dateTo) loadData();
}

// ── Load ──────────────────────────────────────────────────
async function loadData(){
  const root = document.getElementById('root');
  const qs = _dateFrom?`?dateFrom=${_dateFrom}&dateTo=${_dateTo||_dateFrom}`:'';
  try {
    const res = await fetch(`/api/public/track/${token}${qs}`);
    _data = await res.json();
    if(!res.ok){ root.innerHTML=`<div class="error-box">❌ ${esc(_data.error||'ไม่พบข้อมูล')}</div>`; return; }
    document.title = `ติดตามเคส — ${_data.company}`;
    document.getElementById('page-title').textContent = `📋 ${_data.company}`;
    // Update date label
    const lbl = document.getElementById('date-label');
    if(lbl) lbl.textContent = `${fmtD(_data.dateFrom)} – ${fmtD(_data.dateTo)}`;
    renderStats();
    const tab = document.getElementById('active-tab')?.dataset?.tab || 'overview';
    if(tab==='overview') renderOverview();
    else if(tab==='list') renderList();
    else if(tab==='repair') renderRepair();
    else if(tab==='requirements') renderRequirements();
    else if(tab==='issues') renderIssues();
  } catch(e){
    root.innerHTML=`<div class="error-box">❌ ${esc(e.message)}</div>`;
  }
}

// ── Initial render (build shell) ─────────────────────────
async function init(){
  const root = document.getElementById('root');
  if(!token){ root.innerHTML='<div class="error-box">❌ ไม่พบ link ที่ถูกต้อง</div>'; return; }

  // Set default 30 days
  _dateFrom = daysAgo(29); _dateTo = today();

  root.innerHTML = `
    <!-- Date bar -->
    <div class="date-bar">
      <button class="drb-btn" onclick="setRange('today',this)">วันนี้</button>
      <button class="drb-btn" onclick="setRange('7d',this)">7 วัน</button>
      <button class="drb-btn active" onclick="setRange('30d',this)">30 วัน</button>
      <button class="drb-btn" onclick="setRange('month',this)">เดือนนี้</button>
      <input type="date" id="df" class="date-input" value="${_dateFrom}"/>
      <span style="color:#94a3b8;font-size:.8rem">–</span>
      <input type="date" id="dt" class="date-input" value="${_dateTo}" onchange="applyCustom()"/>
      <button class="drb-btn" onclick="applyCustom()">ค้นหา</button>
      <span class="date-range-label" id="date-label"></span>
    </div>

    <!-- Page tabs -->
    <div class="nav-tabs">
      <button class="nav-tab active" id="active-tab" data-tab="overview" onclick="switchTab('overview',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        Overview
      </button>
      <button class="nav-tab" data-tab="list" onclick="switchTab('list',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><line x1="9" y1="12" x2="15" y2="12"/><line x1="9" y1="16" x2="13" y2="16"/></svg>
        รายการ Case
      </button>
      <button class="nav-tab" data-tab="repair" onclick="switchTab('repair',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 000 1.4l1.6 1.6a1 1 0 001.4 0l3.77-3.77a6 6 0 01-7.94 7.94l-6.91 6.91a2.12 2.12 0 01-3-3l6.91-6.91a6 6 0 017.94-7.94l-3.76 3.76z"/></svg>
        งานซ่อม
        <span id="repair-update-badge" style="display:none;background:#ef4444;color:#fff;border-radius:50%;width:16px;height:16px;font-size:.65rem;font-weight:800;display:none;align-items:center;justify-content:center;animation:pulse 1s infinite">!</span>
      </button>
      <button class="nav-tab" data-tab="requirements" onclick="switchTab('requirements',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><polyline points="9 11 12 14 16 10"/></svg>
        Requirements
      </button>
      <button class="nav-tab" data-tab="issues" onclick="switchTab('issues',this)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
        งานติดตาม Issue
      </button>
    </div>

    <div id="tab-content"></div>`;

  await loadData();
}

function switchTab(tab, btn){
  document.querySelectorAll('.nav-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  btn.id='active-tab'; btn.dataset.tab=tab;
  if(tab==='overview') renderOverview();
  else if(tab==='list') renderList();
  else if(tab==='repair'){ renderRepair(); }
  else if(tab==='requirements') renderRequirements();
  else if(tab==='issues') renderIssues();
}

function renderStats(){ /* stats now rendered inside each tab */ }

function caseStatsHtml(){
  if(!_data) return '';
  const t = _data.tickets||[];
  const total = t.length;
  const open  = t.filter(x=>!isClosed(x.status)).length;
  const close = t.filter(x=>isClosed(x.status)).length;
  return `<div class="stat-grid" style="margin-bottom:.85rem">
    <div class="stat-card"><div class="icon" style="background:#eff6ff">📋</div><div><div class="label">Case ทั้งหมด</div><div class="value" style="color:#2563eb">${total.toLocaleString()}</div></div></div>
    <div class="stat-card"><div class="icon" style="background:#fef2f2">⏳</div><div><div class="label">ค้างอยู่ (OPEN)</div><div class="value" style="color:#dc2626">${open.toLocaleString()}</div></div></div>
    <div class="stat-card"><div class="icon" style="background:#f0fdf4">✅</div><div><div class="label">แก้ไขแล้ว (CLOSE)</div><div class="value" style="color:#16a34a">${close.toLocaleString()}</div></div></div>
  </div>`;
}

// ── Overview Tab ─────────────────────────────────────────
function renderOverview(){
  const d = _data;
  if(!d){ document.getElementById('tab-content').innerHTML=''; return; }

  const tickets = d.tickets||[];
  const isGrp   = d.isGroup;

  // TOP 5 branches
  const top5 = (isGrp ? d.branchStats||[] : []).slice(0,5);
  const maxT  = top5[0]?.total || 1;
  const top5Html = top5.map((b,i)=>`
    <div class="top5-item">
      <div class="top5-rank ${i===0?'r1':i===1?'r2':i===2?'r3':''}">${i+1}</div>
      <div class="top5-bar-wrap">
        <div class="top5-name" title="${esc(b.CompanyName)}">${esc(b.CompanyName)}</div>
        <div class="top5-sub">${b.open_count>0?`<span style="color:#dc2626">${b.open_count} open</span> / `:''} ${b.total} close</div>
        <div class="top5-bar-track"><div class="top5-bar-fill" style="width:${Math.round(b.total/maxT*100)}%"></div></div>
      </div>
      <div class="top5-cnt">${b.total}</div>
    </div>`).join('') || '<div style="color:#94a3b8;font-size:.82rem;padding:.5rem 0">ไม่มีข้อมูล</div>';

  document.getElementById('tab-content').innerHTML = `
    ${caseStatsHtml()}
    ${isGrp ? `
    <div class="chart-grid">
      <div class="card">
        <div class="card-title">📊 CASE แยกตามสาขา</div>
        <div class="chart-wrap"><canvas id="c-branch"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">🏆 TOP 5 สาขาที่มีเคสมากสุด</div>
        ${top5Html}
      </div>
    </div>` : ''}

    <div class="${isGrp?'chart-grid':'chart-grid-3'}">
      <div class="card">
        <div class="card-title">📈 แนวโน้มรายวัน</div>
        <div class="chart-wrap${isGrp?'-sm':''}"><canvas id="c-trend"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">🥧 ประเภทปัญหา</div>
        <div class="chart-wrap${isGrp?'-sm':''}"><canvas id="c-pt"></canvas></div>
      </div>
      ${!isGrp?`<div class="card">
        <div class="card-title">⏰ 5 เคสล่าสุด</div>
        ${tickets.slice(0,5).map(t=>`
          <div style="padding:.3rem 0;border-bottom:1px solid #f1f5f9;font-size:.78rem">
            <div style="display:flex;justify-content:space-between">
              <span style="font-weight:600">#${t.id}</span>
              <span class="badge ${badgeCls(t.status)}">${esc(t.status||'—')}</span>
            </div>
            <div style="color:#475569;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(t.title||'—')}</div>
            <div style="color:#94a3b8;font-size:.7rem">${fmtDate(t.opened_at)}</div>
          </div>`).join('')||'<div class="empty">ไม่มีข้อมูล</div>'}
      </div>`:''}
    </div>

    <!-- Peak Time -->
    <div class="chart-grid">
      <div class="card">
        <div class="card-title">⏰ Peak Time — ช่วงเวลาที่แจ้งปัญหามากสุด</div>
        <div class="chart-wrap"><canvas id="c-peak-hour"></canvas></div>
      </div>
      <div class="card">
        <div class="card-title">📅 Peak Day — วันที่แจ้งปัญหามากสุด</div>
        <div style="display:flex;flex-direction:column;gap:.35rem;margin-top:.25rem" id="peak-day-list"></div>
      </div>
    </div>`;

  // Draw charts
  Object.values(_charts).forEach(c=>c?.destroy());
  _charts = {};

  const chartOpts = (type='bar') => ({
    responsive:true, maintainAspectRatio:false,
    plugins:{ legend:{ display:type==='doughnut', position:'bottom', labels:{ font:{size:10}, boxWidth:10, padding:8 } } },
    scales: type==='doughnut' ? undefined : {
      x:{ ticks:{font:{size:9},color:'#64748b'}, grid:{display:false} },
      y:{ beginAtZero:true, ticks:{font:{size:9},color:'#64748b'}, grid:{color:'#f1f5f9'} }
    }
  });

  // Branch bar
  if(isGrp && document.getElementById('c-branch')){
    const bs = (d.branchStats||[]).slice(0,15);
    _charts.branch = new Chart(document.getElementById('c-branch'), {
      type:'bar',
      data:{ labels:bs.map(b=>b.CompanyName.replace(/^(.*?)\s*\(.*\)$/,'$1').substring(0,20)),
        datasets:[
          { label:'CLOSE', data:bs.map(b=>b.total-b.open_count), backgroundColor:'#4ade80', borderRadius:3 },
          { label:'OPEN',  data:bs.map(b=>b.open_count), backgroundColor:'#f87171', borderRadius:3 }
        ]},
      options:{ ...chartOpts(), plugins:{ legend:{ display:true,position:'top',labels:{font:{size:10},boxWidth:10} } },
        scales:{ x:{ stacked:true, ticks:{font:{size:8},color:'#64748b',maxRotation:40}, grid:{display:false} },
                 y:{ stacked:true, beginAtZero:true, ticks:{font:{size:9}}, grid:{color:'#f1f5f9'} } } }
    });
  }

  // Trend line
  if(document.getElementById('c-trend')){
    const td = d.trendData||[];
    _charts.trend = new Chart(document.getElementById('c-trend'), {
      type:'line',
      data:{ labels:td.map(r=>{ const d=parseD(r.day); return d?d.toLocaleDateString('th-TH',{day:'numeric',month:'short'}):r.day; }),
        datasets:[{ label:'เคส', data:td.map(r=>r.cnt), borderColor:'#2563eb', backgroundColor:'rgba(37,99,235,.1)',
          fill:true, tension:.4, pointRadius:3, pointBackgroundColor:'#2563eb' }]},
      options: chartOpts('line')
    });
  }

  // Problem type donut
  if(document.getElementById('c-pt')){
    const pt = (d.problemTypes||[]).slice(0,6);
    const colors = ['#38bdf8','#818cf8','#34d399','#fb923c','#f472b6','#a78bfa'];
    _charts.pt = new Chart(document.getElementById('c-pt'), {
      type:'doughnut',
      data:{ labels:pt.map(p=>p.problem_type||'อื่นๆ'),
        datasets:[{ data:pt.map(p=>p.cnt), backgroundColor:colors, borderWidth:2, borderColor:'#fff' }]},
      options:{ ...chartOpts('doughnut'), cutout:'55%',
        plugins:{ legend:{ display:true, position:'bottom',
          labels:{ font:{size:9}, boxWidth:9, padding:6,
            generateLabels: chart => chart.data.labels.map((l,i)=>({
              text:`${l} (${chart.data.datasets[0].data[i]})`,
              fillStyle:colors[i], strokeStyle:'#fff', lineWidth:1, index:i })) } } } }
    });
  }

  // ── Peak Time ─────────────────────────────────────────────
  // Count tickets by hour (0–23) — client-side only, no extra API call
  const hourCounts = Array(24).fill(0);
  const dayCounts  = Array(7).fill(0); // 0=Sun…6=Sat
  tickets.forEach(t => {
    const dt = parseD(t.opened_at);
    if(!dt) return;
    hourCounts[dt.getHours()]++;
    dayCounts[dt.getDay()]++;
  });
  const maxHour = Math.max(...hourCounts, 1);

  // Color bars: red for peak, amber for near-peak, blue for normal
  const hourColors = hourCounts.map(c => {
    if(c >= maxHour * .75) return '#ef4444';
    if(c >= maxHour * .45) return '#f59e0b';
    return '#93c5fd';
  });

  if(document.getElementById('c-peak-hour')){
    _charts.peakHour = new Chart(document.getElementById('c-peak-hour'), {
      type:'bar',
      data:{
        labels: Array.from({length:24}, (_,i) => `${String(i).padStart(2,'0')}:00`),
        datasets:[{ label:'จำนวน Case', data:hourCounts, backgroundColor:hourColors, borderRadius:3, borderSkipped:false }]
      },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false },
          tooltip:{ callbacks:{ label: ctx => ` ${ctx.parsed.y} case` } } },
        scales:{
          x:{ ticks:{ font:{size:8}, color:'#64748b', maxRotation:0,
                callback:(_, i) => (i%3===0 ? `${String(i).padStart(2,'0')}:00` : '') },
              grid:{display:false} },
          y:{ beginAtZero:true, ticks:{font:{size:9},color:'#64748b',stepSize:1}, grid:{color:'#f1f5f9'} }
        }
      }
    });
  }

  // Peak day bar list
  const dayNames = ['อาทิตย์','จันทร์','อังคาร','พุธ','พฤหัส','ศุกร์','เสาร์'];
  const dayEmoji = ['☀️','🔵','🔴','🟢','🟠','🟡','🟣'];
  const maxDay   = Math.max(...dayCounts, 1);
  const peakDayEl = document.getElementById('peak-day-list');
  if(peakDayEl){
    peakDayEl.innerHTML = dayNames.map((name, i) => {
      const cnt  = dayCounts[i];
      const pct  = Math.round(cnt / maxDay * 100);
      const isPeak = cnt === maxDay && cnt > 0;
      const barCol = isPeak ? '#ef4444' : pct >= 60 ? '#f59e0b' : '#93c5fd';
      return `<div style="display:flex;align-items:center;gap:.5rem">
        <span style="font-size:.8rem;width:56px;flex-shrink:0;font-weight:${isPeak?'700':'400'};color:${isPeak?'#dc2626':'#475569'}">${dayEmoji[i]} ${name}</span>
        <div style="flex:1;height:16px;background:#f1f5f9;border-radius:4px;overflow:hidden">
          <div style="width:${pct}%;height:100%;background:${barCol};border-radius:4px;transition:width .4s"></div>
        </div>
        <span style="font-size:.8rem;font-weight:700;color:${barCol};min-width:28px;text-align:right">${cnt}</span>
        ${isPeak?'<span style="font-size:.68rem;background:#fee2e2;color:#b91c1c;padding:.1rem .35rem;border-radius:20px;font-weight:700">🔥 Peak</span>':''}
      </div>`;
    }).join('');
  }
}

function setStatusTab(tab, btn){
  document.querySelectorAll('#s-tabs .s-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  _statusTab=tab; _page=1;
  renderListTable();
}

function listFilter(){ _page=1; renderListTable(); }

function getFilteredList(){
  if(!_data) return [];
  const branch  = document.getElementById('l-branch')?.value || '';
  const status  = document.getElementById('l-status')?.value || '';
  const type    = document.getElementById('l-type')?.value || '';
  const subject = document.getElementById('l-subject')?.value || '';
  const search  = (document.getElementById('l-search')?.value||'').toLowerCase();
  let list = _data.tickets||[];
  if(branch)  list = list.filter(t=>t.CompanyName===branch);
  if(status)  list = list.filter(t=>t.status===status);
  if(type)    list = list.filter(t=>t.problem_type===type);
  if(subject) list = list.filter(t=>t.title===subject);
  if(_statusTab==='open')  list = list.filter(t=>!isClosed(t.status));
  if(_statusTab==='close') list = list.filter(t=>isClosed(t.status));
  if(search)  list = list.filter(t=>
    (t.CompanyName||'').toLowerCase().includes(search)||
    (t.title||'').toLowerCase().includes(search)||
    (t.problem_type||'').toLowerCase().includes(search));
  return list;
}

function fmtDateStr(s){
  const d = parseD(s); if(!d) return '';
  return d.toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})
    +' '+d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
}

function exportListExcel(){
  if(!window.XLSX){ alert('กำลังโหลด XLSX library กรุณาลองใหม่'); return; }
  const list = getFilteredList();
  if(!list.length){ alert('ไม่มีข้อมูลสำหรับ Export'); return; }
  const isGrp = _data?.isGroup;
  const btn = document.getElementById('btn-export-excel');
  if(btn){ btn.textContent='⏳ กำลัง Export...'; btn.disabled=true; }

  try {
    const rows = list.map((t, i) => {
      const row = { 'ลำดับ': i+1 };
      if(isGrp) row['สาขา'] = t.CompanyName||'';
      row['ประเภทปัญหา']   = t.problem_type||'';
      row['หัวข้อ']          = t.title||'';
      row['รายละเอียดปัญหา'] = t.description||'';
      row['แนวทางแก้ไข']    = t.Solution||'';
      row['สถานะ']           = t.status||'';
      row['วันที่แจ้ง']       = fmtDateStr(t.opened_at);
      row['ใช้เวลา (นาที)']  = t.resolve_minutes ?? '';
      row['วันที่ปิด']        = fmtDateStr(t.CloseDate);
      return row;
    });

    const ws = XLSX.utils.json_to_sheet(rows);

    // Column widths
    const colDefs = [
      {wch:6},
      ...(isGrp?[{wch:28}]:[]),
      {wch:18},{wch:35},{wch:45},{wch:45},{wch:14},{wch:22},{wch:14},{wch:22}
    ];
    ws['!cols'] = colDefs;

    // Header style (bold) — SheetJS CE supports cell metadata
    const range = XLSX.utils.decode_range(ws['!ref']);
    for(let C = range.s.c; C <= range.e.c; C++){
      const cell = ws[XLSX.utils.encode_cell({r:0,c:C})];
      if(cell) cell.s = { font:{bold:true}, fill:{fgColor:{rgb:'D9E1F2'}} };
    }

    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Case List');

    const company = (_data?.company||'export').replace(/[/\\?%*:|"<>]/g,'_');
    const dateStr = new Date().toISOString().split('T')[0];
    XLSX.writeFile(wb, `CaseList_${company}_${dateStr}.xlsx`);
  } finally {
    if(btn){
      btn.disabled=false;
      btn.innerHTML=`<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg> Export Excel`;
    }
  }
}

function renderListTable(){
  if(!_data) return;
  const perPage = parseInt(document.getElementById('l-perpage')?.value||'25');
  const isGrp   = _data.isGroup;

  let list = getFilteredList();

  // Update tab counts (based on current branch+status filter only, ignoring search/type/subject/statusTab)
  const _branch2 = document.getElementById('l-branch')?.value || '';
  const _status2 = document.getElementById('l-status')?.value || '';
  const all=_data.tickets||[];
  const base = (_branch2||_status2)
    ? (_branch2 ? all.filter(t=>t.CompanyName===_branch2) : all).filter(t=>!_status2||t.status===_status2)
    : all;
  const setC=(id,v)=>{const e=document.getElementById(id);if(e)e.textContent=v;};
  setC('cnt-open',  base.filter(t=>!isClosed(t.status)).length);
  setC('cnt-close', base.filter(t=>isClosed(t.status)).length);
  setC('cnt-all',   base.length);

  const total = list.length;
  const totalPages = Math.max(1, Math.ceil(total/perPage));
  if(_page>totalPages) _page=totalPages;
  const start = (_page-1)*perPage;
  const page  = list.slice(start, start+perPage);

  const tbody = document.getElementById('list-tbody');
  if(!tbody) return;
  if(!page.length){ tbody.innerHTML=`<tr><td colspan="${isGrp?7:6}" class="empty">ไม่พบเคส</td></tr>`; }
  else tbody.innerHTML = page.map((t,i)=>`
    <tr>
      <td style="color:#94a3b8">${start+i+1}</td>
      ${isGrp?`<td style="max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:.77rem" title="${esc(t.CompanyName)}">${esc(t.CompanyName||'—')}</td>`:''}
      <td>
        ${t.problem_type?`<span style="background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:4px;font-size:.68rem;padding:.02rem .35rem;margin-right:.3rem">${esc(t.problem_type)}</span>`:''}
        <span style="font-size:.8rem">${esc(t.title||'—')}</span>
      </td>
      <td style="white-space:nowrap;font-size:.77rem">${fmtDate(t.opened_at)}</td>
      <td style="white-space:nowrap">${fmtDur(t.resolve_minutes)}</td>
      <td><span class="badge ${badgeCls(t.status)}">${esc(t.status||'—')}</span></td>
      <td style="white-space:nowrap;font-size:.77rem">${t.CloseDate?fmtDate(t.CloseDate):'—'}</td>
    </tr>
    ${t.description||t.Solution?`<tr style="background:#fafafa">
      <td colspan="${isGrp?7:6}" style="padding:.35rem .65rem .55rem 1.5rem">
        ${t.description?`<div style="font-size:.77rem;color:#475569;margin-bottom:.2rem"><b>ปัญหา:</b> ${esc(t.description)}</div>`:''}
        ${t.Solution?`<div style="font-size:.77rem;color:#15803d"><b>แก้ไข:</b> ${esc(t.Solution)}</div>`:''}
      </td>
    </tr>`:''}
  `).join('');

  // Pagination
  const pagi = document.getElementById('pagi');
  if(!pagi) return;
  if(totalPages<=1){ pagi.innerHTML=''; return; }
  let html = `<button ${_page===1?'disabled':''} onclick="goPage(${_page-1})">‹</button>`;
  const pages=[];
  if(totalPages<=7){for(let i=1;i<=totalPages;i++)pages.push(i);}
  else{pages.push(1);if(_page>4)pages.push('…');for(let i=Math.max(2,_page-2);i<=Math.min(totalPages-1,_page+2);i++)pages.push(i);if(_page<totalPages-3)pages.push('…');pages.push(totalPages);}
  pages.forEach(p=>{ html+=p==='…'?`<span style="padding:0 .2rem;color:#94a3b8">…</span>`:
    `<button class="${p===_page?'active':''}" onclick="goPage(${p})">${p}</button>`; });
  html+=`<button ${_page===totalPages?'disabled':''} onclick="goPage(${_page+1})">›</button>`;
  html+=`<span style="font-size:.75rem;color:#64748b;margin-left:.3rem">หน้า ${_page}/${totalPages} · ${total} รายการ</span>`;
  pagi.innerHTML=html;
}
function goPage(p){ _page=p; renderListTable(); document.getElementById('tab-content').scrollIntoView({behavior:'smooth',block:'start'}); }

}
function closeComplain(){ document.getElementById('modal-complain').style.display='none'; }

let _complainSubmitting = false;
async function submitComplain(){
  if(_complainSubmitting) return;
  const msg = document.getElementById('c-msg').value.trim();
  if(!msg){ alert('กรุณาระบุรายละเอียด'); return; }
  const btn = document.getElementById('complain-submit-btn');
  _complainSubmitting = true;
  if(btn){ btn.disabled=true; btn.textContent='⏳ กำลังส่ง...'; }
  try {
    const r = await fetch('/api/public/complaint',{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token,ticket_id:document.getElementById('c-ticket-id').value||null,
        email:document.getElementById('c-email').value||null,message:msg})});
    const d = await r.json();
    closeComplain();
    alert(r.ok?'📤 ส่งแล้ว! ทีม CS จะติดต่อกลับ':'❌ '+(d.error||'ส่งไม่สำเร็จ'));
  } catch(e){
    alert('❌ ส่งไม่สำเร็จ กรุณาลองใหม่');
    if(btn){ btn.disabled=false; btn.textContent='📤 ส่ง'; }
  } finally {
    _complainSubmitting = false;
  }
}

function renderRepairTimeline(j){
  // ใช้ steps ตาม workflow ใหม่ (หรือ legacy ถ้าสถานะยังเป็นแบบเก่า)
  const legacySt = ['device_received','sent_supplier','returned_from_supplier','returned_to_customer','closed'];
  const isLegacy = legacySt.includes(j.status);
  const steps = isLegacy ? [
    {key:'received',              label:'รับเรื่อง',        date:j.reported_at},
    {key:'assessing',             label:'ประเมิน',          date:null},
    {key:'quoted',                label:'เสนอราคา',         date:null},
    {key:'waiting_approval',      label:'รออนุมัติ',        date:null},
    {key:'device_received',       label:'รับเครื่อง',       date:j.received_date},
    {key:'sent_supplier',         label:'ส่ง Supplier',     date:j.sent_supplier_date},
    {key:'returned_from_supplier',label:'ได้คืน',           date:j.returned_from_supplier_date},
    {key:'returned_to_customer',  label:'ส่งคืนลูกค้า',    date:j.returned_to_customer_date},
  ] : [
    {key:'received',          label:'รับเรื่อง',          date:j.reported_at},
    {key:'spared',            label:'สแปร์แล้ว',          date:null},
    {key:'assessing',         label:'ประเมินงาน',         date:null},
    {key:'quoted',            label:'เสนอราคา',           date:null},
    {key:'waiting_approval',  label:'รออนุมัติ',          date:null},
    {key:'repairing',         label:'ซ่อมแซม',            date:null},
    {key:'waiting_return',    label:'รอส่งคืน',           date:null},
    {key:'returned',          label:'ส่งคืนแล้ว',         date:null},
  ];
  const ORDER=steps.map(s=>s.key);
  const curIdx=ORDER.indexOf(j.status);
  return `<div style="display:flex;gap:0;overflow-x:auto;padding:.35rem 0 .1rem">${steps.map((s,i)=>{
    const done=curIdx>=0&&i<=curIdx;
    const active=s.key===j.status;
    const col=done?'#16a34a':active?'#2563eb':'#e2e8f0';
    const txtCol=done?'#15803d':active?'#2563eb':'#94a3b8';
    const lineL=done&&i>0?'#16a34a':'#e2e8f0';
    const lineR=curIdx>i?'#16a34a':'#e2e8f0';
    return `<div style="display:flex;flex-direction:column;align-items:center;flex:1;min-width:52px;position:relative">
      ${i>0?`<div style="position:absolute;left:0;top:12px;width:50%;height:2px;background:${lineL}"></div>`:''}
      ${i<steps.length-1?`<div style="position:absolute;right:0;top:12px;width:50%;height:2px;background:${lineR}"></div>`:''}
      <div style="width:26px;height:26px;border-radius:50%;background:${col};color:${col==='#e2e8f0'?'#94a3b8':'#fff'};border:2px solid ${col==='#e2e8f0'?'#d1d5db':col};display:flex;align-items:center;justify-content:center;font-size:.7rem;z-index:1;position:relative;font-weight:700">${done?'✓':active?'●':'○'}</div>
      <div style="font-size:.62rem;text-align:center;margin-top:.25rem;color:${txtCol};font-weight:${active?'700':'400'};line-height:1.3;padding:0 .1rem">${s.label}</div>
      ${(s.date&&done)?`<div style="font-size:.58rem;color:#94a3b8;margin-top:.1rem">${fmtD(s.date)}</div>`:''}
    </div>`;
  }).join('')}</div>`;
}

async function sendRepairMsg(repairToken, jobId){
  const name=document.getElementById(`rn-${jobId}`)?.value.trim()||'';

  if(!msg){alert('กรุณาพิมพ์ข้อความก่อนส่ง');return;}
  const r=await fetch(`/api/public/repair/${repairToken}/message`,{method:'POST',
    headers:{'Content-Type':'application/json'},body:JSON.stringify({name,message:msg})});
  const d=await r.json();
  if(r.ok){
    document.getElementById(`rm-${jobId}`).value='';
    alert('📤 ส่งแล้ว! ทีม CS จะติดต่อกลับ');
  } else alert('❌ '+(d.error||'ส่งไม่สำเร็จ'));
}

                ${r.reported_date?`<div>📅 วันที่แจ้ง: ${fmtD(r.reported_date)}</div>`:''}
                ${r.contract_end?`<div${isOvd?' style="color:#b91c1c;font-weight:600"':''}>🗓 กำหนด: ${fmtD(r.contract_end)}${isOvd?' ⚠️':''}</div>`:''}
                ${r.so_no?`<div>📄 SO: ${esc(r.so_no)}</div>`:''}
                ${r.sales_person?`<div>👤 ฝ่ายขาย: ${esc(r.sales_person)}</div>`:''}
                ${r.update_version?`<div>🏷 เวอร์ชั่น: ${esc(r.update_version)}</div>`:''}
              </div>
              ${links.length ? `<div style="display:flex;flex-wrap:wrap;gap:.4rem;margin-top:.6rem">${links.join('')}</div>` : ''}
            </div>
          </div>`;
        }).join('');
}

function rqSearch(){
  const q = (document.getElementById('rq-q')?.value||'').toLowerCase();
  const all = Array.isArray(_requirements) ? _requirements : (_requirements?.requirements||[]);
  const filtered = all.filter(r=>
    !q || (r.title||'').toLowerCase().includes(q) ||
    (r.req_no||'').toLowerCase().includes(q) ||
    (r.so_no||'').toLowerCase().includes(q) ||
    (r.description||'').toLowerCase().includes(q)
  );
  const el = document.getElementById('rq-items-list');
  if(el) el.innerHTML = reqItemsHtml(filtered);
}

function toggleReqDetail(id, idx){
  const el = document.getElementById(id);
  const arr = document.getElementById('rq-arr-'+idx);
  if(!el) return;
  const open = el.style.display==='none';
  el.style.display = open ? '' : 'none';
  if(arr) arr.textContent = open ? '▲' : '▼';
}

// ── Issues Tab ────────────────────────────────────────────
const SP_STATUS_MAP = {
  pending:     { label:'รอดำเนินการ',      bg:'#fef9c3', col:'#854d0e' },
  in_progress: { label:'กำลังดำเนินการ',  bg:'#dbeafe', col:'#1d4ed8' },
  resolved:    { label:'แก้ไขแล้ว',        bg:'#dcfce7', col:'#15803d' },
  cancelled:   { label:'ยกเลิก',           bg:'#f1f5f9', col:'#64748b' },
};

function spStatusBadge(s){
  const m = SP_STATUS_MAP[s] || { label: s||'—', bg:'#f1f5f9', col:'#475569' };
  return `<span style="background:${m.bg};color:${m.col};padding:.15rem .5rem;border-radius:20px;font-size:.7rem;font-weight:700;white-space:nowrap">${esc(m.label)}</span>`;
}

let _issueSearch = '';
function issueSearch(){
  _issueSearch = (document.getElementById('iss-q')?.value||'').toLowerCase();
  renderIssueCards();
}

function renderIssueCards(){
  const all = _issues||[];
  const filtered = all.filter(s=>
    !_issueSearch ||
    (s.subject||'').toLowerCase().includes(_issueSearch) ||
    (s.issue_id||'').toLowerCase().includes(_issueSearch) ||
    (s.problem_type||'').toLowerCase().includes(_issueSearch) ||
    (s.resolution_note||'').toLowerCase().includes(_issueSearch)
  );
  const el = document.getElementById('iss-list');
  if(!el) return;
  if(!filtered.length){ el.innerHTML='<div class="empty">ไม่พบงานติดตาม Issue</div>'; return; }
  el.innerHTML = filtered.map((s,i)=>{
    const issUrl = (s.issue_id||'').startsWith('http') ? s.issue_id : null;
    return `<div class="card" style="margin-bottom:.65rem;padding:0;overflow:hidden">
      <div onclick="toggleIssueDetail('isd-${i}')"
           style="padding:.85rem 1rem;cursor:pointer;display:flex;align-items:flex-start;justify-content:space-between;gap:.75rem;flex-wrap:wrap">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;margin-bottom:.3rem">
            ${s.problem_type?`<span style="background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0;border-radius:4px;font-size:.68rem;font-weight:700;padding:.1rem .4rem">${esc(s.problem_type)}</span>`:''}
            <span style="font-size:.88rem;font-weight:700;color:#1e293b">${esc(s.subject||'—')}</span>
          </div>
          <div style="display:flex;align-items:center;gap:.5rem;flex-wrap:wrap">
            ${spStatusBadge(s.status)}
            ${issUrl
              ? `<a href="${esc(issUrl)}" target="_blank" onclick="event.stopPropagation()"
                   style="display:inline-flex;align-items:center;gap:.25rem;font-size:.77rem;color:#2563eb;text-decoration:none;background:#eff6ff;border:1px solid #bfdbfe;padding:.15rem .55rem;border-radius:6px">
                   🔗 ${esc(s.issue_id.length>50?s.issue_id.slice(0,50)+'…':s.issue_id)}</a>`
              : s.issue_id?`<span style="font-size:.75rem;color:#6d28d9;background:#ede9fe;border-radius:6px;padding:.15rem .5rem;font-family:monospace">${esc(s.issue_id)}</span>`:''
            }
          </div>
        </div>
        <div style="text-align:right;flex-shrink:0">
          <div style="font-size:.7rem;color:#94a3b8;white-space:nowrap">📅 ${fmtDate(s.assigned_at)}</div>
          ${s.accepted_by_name?`<div style="font-size:.72rem;color:#64748b;margin-top:.15rem">👤 ${esc(s.accepted_by_name)}</div>`:''}
          <span id="isd-arr-${i}" style="font-size:.7rem;color:#94a3b8">▼</span>
        </div>
      </div>
      <div id="isd-${i}" style="display:none;border-top:1px solid #f1f5f9;padding:.75rem 1rem .9rem;background:#fafbff">
        ${s.description?`
          <div style="font-size:.72rem;font-weight:700;color:#64748b;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem">รายละเอียดปัญหา</div>
          <div style="font-size:.82rem;color:#1e293b;white-space:pre-wrap;word-break:break-word;background:#fff;border:1px solid #e2e8f0;border-radius:8px;padding:.55rem .75rem;margin-bottom:.55rem">${esc(s.description)}</div>`:''}
        ${s.resolution_note?`
          <div style="font-size:.72rem;font-weight:700;color:#15803d;text-transform:uppercase;letter-spacing:.04em;margin-bottom:.3rem">✅ การแก้ไข</div>
          <div style="font-size:.82rem;color:#1e293b;white-space:pre-wrap;word-break:break-word;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:.55rem .75rem;margin-bottom:.55rem">${esc(s.resolution_note)}</div>`:''}
        <div style="display:flex;flex-wrap:wrap;gap:.75rem;font-size:.76rem;color:#64748b;margin-top:.25rem">
          ${s.calllog_id?`<span>📋 Case #${esc(String(s.calllog_id))}</span>`:''}
          ${s.resolved_at?`<span>✅ แก้ไขเมื่อ: ${fmtDate(s.resolved_at)}</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleIssueDetail(id){
  const el = document.getElementById(id);
  const idx = id.replace('isd-','');
  const arr = document.getElementById('isd-arr-'+idx);
  if(!el) return;
  const open = el.style.display==='none';
  el.style.display = open?'':'none';
  if(arr) arr.textContent = open?'▲':'▼';
}

async function renderIssues(){
  const wrap = document.getElementById('tab-content');
  wrap.innerHTML = '<div class="loading">⏳ กำลังโหลด...</div>';
  try {
    if(!_issues){
      const r = await fetch(`/api/public/track/${token}/issues`);
      _issues = await r.json();
      if(!r.ok) throw new Error(_issues.error||'โหลดไม่สำเร็จ');
    }
    const total    = _issues.length;
    const pending  = _issues.filter(s=>s.status==='pending').length;
    const inProg   = _issues.filter(s=>s.status==='in_progress').length;
    const resolved = _issues.filter(s=>s.status==='resolved').length;

    wrap.innerHTML = `
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:.5rem;margin-bottom:.85rem">
        <div class="stat-card"><div class="icon" style="background:#eff6ff">🔗</div><div><div class="label">Issue ทั้งหมด</div><div class="value" style="color:#2563eb">${total}</div></div></div>
        <div class="stat-card"><div class="icon" style="background:#fef9c3">⏳</div><div><div class="label">รอดำเนินการ</div><div class="value" style="color:#854d0e">${pending}</div></div></div>
        <div class="stat-card"><div class="icon" style="background:#dbeafe">⚙️</div><div><div class="label">กำลังดำเนินการ</div><div class="value" style="color:#1d4ed8">${inProg}</div></div></div>
        <div class="stat-card"><div class="icon" style="background:#dcfce7">✅</div><div><div class="label">แก้ไขแล้ว</div><div class="value" style="color:#16a34a">${resolved}</div></div></div>
      </div>
      <div style="margin-bottom:.75rem">
        <input id="iss-q" type="text" placeholder="🔍 ค้นหาหัวข้อ / Issue ID / รายละเอียด..."
          oninput="issueSearch()"
          style="width:100%;border:1px solid #e2e8f0;border-radius:8px;padding:.52rem .85rem;font-size:.88rem;outline:none"
          onfocus="this.style.borderColor='#3b82f6'" onblur="this.style.borderColor='#e2e8f0'"/>
      </div>
      <div id="iss-list"></div>`;

    _issueSearch = '';
    renderIssueCards();
  } catch(e){
    wrap.innerHTML=`<div class="error-box">❌ ${esc(e.message)}</div>`;
  }
}

init();

// ── Repair Update Polling ─────────────────────────────────
// badge ! ขึ้นเมื่อลูกค้าส่งข้อความรอ CS ตอบ (pending_reply=1)
// badge หายเมื่อ CS ตอบจริงๆ (pending_reply=0) — ไม่หายแค่เพราะกด tab

let _repairSnapshot = null; // Map: job.id → { status, updated_at }
let _badgeActive    = false;

function showTrackToast(msg, type='red', duration=6000){
  const wrap = document.getElementById('track-toast-wrap');
  if(!wrap) return;
  const d = document.createElement('div');
  d.className = `track-toast ${type}`;
  d.innerHTML = msg;
  wrap.appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .4s'; setTimeout(()=>d.remove(),400); }, duration);
}

function setRepairBadge(show){
  _badgeActive = show;
  const b = document.getElementById('repair-update-badge');
  if(!b) return;
  if(show){ b.classList.add('show'); } else { b.classList.remove('show'); }
}

async function pollRepairUpdates(){
  if(!token) return;
  try {
    const r = await fetch(`/api/public/repairs-by-token/${token}`);
    if(!r.ok) return;
    const jobs = await r.json();
    if(!Array.isArray(jobs)) return;

    // ── 1. badge ขึ้น/ลงตาม pending_reply จาก server ──────────
    const hasPending = jobs.some(j => j.pending_reply === 1 || j.pending_reply === true);
    setRepairBadge(hasPending);

    // ── 2. ตรวจ status/updated_at เพื่อ toast ─────────────────
    if(_repairSnapshot){
      jobs.forEach(j => {
        const snap = _repairSnapshot[j.id];
        if(!snap){
          showTrackToast(`🔧 งานซ่อมใหม่! ${esc(j.job_no)}`, 'red');
          return;
        }
        if(snap.status !== j.status){
          showTrackToast(`🔔 <b>${esc(j.job_no)}</b><br>สถานะ: ${REPAIR_STATUS[j.status]||j.status}`, 'red');
        } else if(snap.updated_at !== j.updated_at){
          // CS ตอบแล้ว (updated_at เปลี่ยน)
          showTrackToast(`💬 <b>${esc(j.job_no)}</b><br>ทีม CS ตอบข้อความแล้ว!`, 'green');
        }
      });
    }

    // ── 3. update snapshot & cache ────────────────────────────
    _repairSnapshot = {};
    jobs.forEach(j => { _repairSnapshot[j.id] = { status: j.status, updated_at: j.updated_at }; });
    _repairs = jobs;

    // ถ้าอยู่ใน repair tab อยู่แล้ว → re-render ให้ข้อมูลล่าสุด
    const activeTab = document.getElementById('active-tab');
    if(activeTab && activeTab.dataset.tab === 'repair'){
      renderRepair();
    }
  } catch(e){ /* silent */ }
}

// เริ่ม poll ทันทีตอน load แล้วทุก 30 วินาที
setTimeout(()=>{
  pollRepairUpdates();
  setInterval(pollRepairUpdates, 30000);
}, 3000);
</script>
